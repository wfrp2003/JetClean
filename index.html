<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Clean Refrigeração</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b192c;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .site-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 85px 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .logo-area {
            width: 80%;
            max-width: 290px;
            text-align: center;
            margin-top: 5px;
            z-index: 2;
        }
        .logo-area img {
            width: 100%;
            height: auto;
        }

        .services-text {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 4px rgba(255,255,255,0.9);
            margin: 10px 0 15px 0;
            line-height: 1.3;
            z-index: 2;
            padding: 0 5px;
        }

        /* Contatos limpos diretamente no fundo (sem caixa branca) */
        .contact-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            z-index: 2;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            text-shadow: 0 1px 4px rgba(255,255,255,0.9);
        }

        .contact-btn svg {
            width: 26px;
            height: 26px;
            margin-right: 8px;
        }

        /* Layout Exato do Flyer Original (Eletrodomésticos) */
        .layout-grid {
            width: 100%;
            z-index: 2;
            margin-top: 5px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .agende-title {
            flex: 1;
            font-size: 1.4rem;
            font-weight: 800;
            color: #000;
            text-shadow: 0 1px 4px rgba(255,255,255,0.9);
            line-height: 1.2;
            padding-right: 10px;
        }

        .fridge-img {
            width: 38%;
            text-align: right;
        }
        .fridge-img img {
            width: 100%;
            max-width: 130px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .middle-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .microwave-img img, .washer-img img {
            width: 100%;
            max-width: 150px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .split-img, .janela-img {
            width: 48%;
        }
        .split-img img, .janela-img img {
            width: 100%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        /* Rodapé de Informações */
        .info-footer {
            text-align: center;
            z-index: 2;
            margin-top: 15px;
            width: 100%;
        }
        .info-footer p {
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
            margin-bottom: 4px;
        }

        /* Barra Inferior Fixa com Ícones Perfeitos */
        .buttons-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(11, 25, 44, 0.98);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 2px solid rgba(255,255,255,0.2);
        }

        .btn-action {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .btn-action svg {
            width: 26px;
            height: 26px;
            margin-bottom: 3px;
        }

        .btn-action.whatsapp svg {
            fill: #25D366;
        }

        .btn-action.instagram svg {
            fill: #E1306C;
        }

        .btn-action.call svg {
            fill: #ffffff;
        }

        /* Efeito de Flocos de Neve */
        .snowflake {
            position: absolute;
            background: transparent;
            color: #ffffff;
            font-size: 1rem;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(105vh) translateX(20px) rotate(360deg); }
        }
    </style>
</head>

    <script>
        // Flocos de neve
        function createSnow() {
            const container = document.getElementById('snow-container');
            const numberOfFlakes = 25;
            const symbols = ['❄', '❅', '❆'];

            for (let i = 0; i < numberOfFlakes; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                
                flake.style.left = Math.random() * 100 + '%';
                flake.style.top = -20 + 'px';
                
                const size = (Math.random() * 8 + 10) + 'px';
                flake.style.fontSize = size;
                
                const duration = (Math.random() * 4 + 3) + 's';
                flake.style.animationDuration = duration;
                
                const delay = (Math.random() * 5) + 's';
                flake.style.animationDelay = delay;
                
                container.appendChild(flake);
            }
        }
        createSnow();
    </script>
