<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Clean Refrigeração</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b192c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contentor principal dimensionado à proporção do flyer */
        .flyer-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background-image: url('flyer.jpg.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Proporção vertical exata para o flyer encaixar sem cortes */
            aspect-ratio: 1 / 1.414; 
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* Áreas Clicáveis Transparentes posicionado exatamente em cima dos botões da imagem */
        .hotspot-whatsapp {
            position: absolute;
            bottom: 3.5%;
            left: 5%;
            width: 43%;
            height: 12%;
            z-index: 10;
            cursor: pointer;
        }

        .hotspot-phone {
            position: absolute;
            bottom: 3.5%;
            left: 52%;
            width: 43%;
            height: 12%;
            z-index: 10;
            cursor: pointer;
        }

        .hotspot-instagram {
            position: absolute;
            bottom: 1%;
            left: 5%;
            width: 43%;
            height: 3%;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="flyer-container">
        <!-- Áreas interativas (links por cima dos botões da imagem do flyer) -->
        <a href="https://wa.me/5521992082838?text=Olá!%20Gostaria%20de%20agendar%20uma%20visita%20técnica." target="_blank" class="hotspot-whatsapp" title="Agendar via WhatsApp"></a>
        
        <a href="tel:5521992082838" class="hotspot-phone" title="Ligar diretamente"></a>
        
        <a href="https://www.instagram.com/jetclean_refrigeracao" target="_blank" class="hotspot-instagram" title="Visitar Instagram"></a>
    </div>

</body>
</html>
