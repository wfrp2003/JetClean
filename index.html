<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Clean Refrigeração</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b192c;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .site-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 90px 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .logo-area {
            width: 75%;
            max-width: 280px;
            text-align: center;
            margin-top: 5px;
            z-index: 2;
        }
        .logo-area img {
            width: 100%;
            height: auto;
        }

        /* Estrutura em Escada / Zigue-Zague para os itens */
        .stairs-container {
            width: 100%;
            margin-top: 15px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stair-item {
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* Alterna os lados da escada */
        .stair-item.left {
            justify-content: flex-start;
        }

        .stair-item.right {
            justify-content: flex-end;
        }

        .stair-content {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stair-item img {
            width: 75px;
            height: auto;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
            flex-shrink: 0;
        }

        .stair-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            line-height: 1.2;
        }

        /* Bloco de Texto Principal solicitado */
        .main-services-text {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 4px rgba(255,255,255,0.9);
            margin: 15px 0;
            padding: 0 5px;
            z-index: 2;
            line-height: 1.3;
        }

        .info-footer {
            text-align: center;
            z-index: 2;
            margin-top: 10px;
            width: 100%;
        }
        .info-footer p {
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
            margin-bottom: 4px;
        }

        /* Barra Inferior Fixa com Links Corrigidos */
        .buttons-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(11, 25, 44, 0.96);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 2px solid rgba(255,255,255,0.2);
        }

        .btn-action {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .btn-action span.icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        /* Efeito de Flocos de Neve */
        .snowflake {
            position: absolute;
            background: transparent;
            color: #ffffff;
            font-size: 1rem;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(105vh) translateX(20px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="site-container" id="snow-container">
        
        <!-- Logo -->
        <div class="logo-area">
            <img src="logo.png" alt="Jet Clean Refrigeração">
        </div>

        <!-- Texto principal exigido -->
        <div class="main-services-text">
            instalação, manutenção e higienização de geladeira freezer microondas máquina de lavar ar condicionado split e janela
        </div>

        <!-- Layout em Escada (Zigue-Zague) com as imagens -->
        <div class="stairs-container">
            <div class="stair-item left">
                <div class="stair-content">
                    <img src="geladeira.png" alt="Geladeira / Freezer">
                    <span class="stair-text">Geladeira / Freezer</span>
                </div>
            </div>

            <div class="stair-item right">
                <div class="stair-content">
                    <img src="split.png" alt="Ar Split">
                    <span class="stair-text">Ar Split</span>
                </div>
            </div>

            <div class="stair-item left">
                <div class="stair-content">
                    <img src="maquina.png" alt="Máquina de Lavar">
                    <span class="stair-text">Máquina de Lavar</span>
                </div>
            </div>

            <div class="stair-item right">
                <div class="stair-content">
                    <img src="janela.png" alt="Ar de Janela">
                    <span class="stair-text">Ar de Janela</span>
                </div>
            </div>

            <div class="stair-item left">
                <div class="stair-content">
                    <img src="micro.png" alt="Micro-ondas">
                    <span class="stair-text">Micro-ondas</span>
                </div>
            </div>
        </div>

        <!-- Textos Finais -->
        <div class="info-footer">
            <p>💳 Aceitamos cartões e Pix</p>
            <p>📅 Agende já sua visita técnica!</p>
        </div>

        <!-- Barra Inferior de Ação (Links corrigidos e funcionais) -->
        <div class="buttons-bar">
            <a href="https://wa.me/5521992082838?text=Olá!%20Gostaria%20de%20agendar%20uma%20visita%20técnica." target="_blank" class="btn-action">
                <span class="icon">💚</span>
                <span>WhatsApp</span>
            </a>
            <a href="tel:5521992082838" class="btn-action">
                <span class="icon">📞</span>
                <span>Ligar</span>
            </a>
            <a href="https://www.instagram.com/jetclean_refrigeracao" target="_blank" class="btn-action">
                <span class="icon">📸</span>
                <span>Instagram</span>
            </a>
        </div>
    </div>

    <script>
        // Flocos de neve ativos
        function createSnow() {
            const container = document.getElementById('snow-container');
            const numberOfFlakes = 25;
            const symbols = ['❄', '❅', '❆'];

            for (let i = 0; i < numberOfFlakes; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                
                flake.style.left = Math.random() * 100 + '%';
                flake.style.top = -20 + 'px';
                
                const size = (Math.random() * 8 + 10) + 'px';
                flake.style.fontSize = size;
                
                const duration = (Math.random() * 4 + 3) + 's';
                flake.style.animationDuration = duration;
                
                const delay = (Math.random() * 5) + 's';
                flake.style.animationDelay = delay;
                
                container.appendChild(flake);
            }
        }
        createSnow();
    </script>
</body>
</html>
