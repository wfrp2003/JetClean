<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Clean Refrigeração</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b192c;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .site-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 90px 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .logo-area {
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-top: 5px;
            z-index: 2;
        }
        .logo-area img {
            width: 100%;
            height: auto;
        }

        .services-text {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
            margin: 10px 0 15px 0;
            line-height: 1.3;
            z-index: 2;
            padding: 0 10px;
        }

        /* Botões de Contato Principais (Estilo da Arte Original) */
        .contact-box {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 6px 0;
        }

        .contact-btn img, .contact-btn span.emoji {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        /* Grade de Eletrodomésticos Organizada como no Original */
        .appliances-section {
            width: 100%;
            z-index: 2;
            margin-top: 5px;
        }

        .row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .left-info {
            flex: 1;
            padding-right: 10px;
        }

        .left-info h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #000;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .right-fridge {
            width: 42%;
            text-align: center;
        }
        .right-fridge img {
            width: 100%;
            max-width: 130px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .grid-middle {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }

        .item-card {
            text-align: center;
            width: 30%;
        }
        .item-card img {
            width: 100%;
            max-width: 100px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            display: block;
            margin: 0 auto;
        }

        .info-footer {
            text-align: center;
            z-index: 2;
            margin-top: 10px;
            width: 100%;
        }
        .info-footer p {
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            text-shadow: 0 1px 3px rgba(255,255,255,0.9);
            margin-bottom: 5px;
        }

        /* Barra Inferior Fixa */
        .buttons-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(11, 25, 44, 0.96);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            border-top: 2px solid rgba(255,255,255,0.2);
        }

        .btn-action {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .btn-action span.icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        /* Efeito de Flocos de Neve */
        .snowflake {
            position: absolute;
            background: transparent;
            color: #ffffff;
            font-size: 1rem;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(105vh) translateX(20px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="site-container" id="snow-container">
        
        <!-- Logo -->
        <div class="logo-area">
            <img src="logo.png" alt="Jet Clean Refrigeração">
        </div>

        <!-- Texto de serviços exato do original -->
        <div class="services-text">
            instalação, manutenção e higienização de geladeira freezer microondas máquina de lavar ar condicionado split e janela
        </div>

        <!-- Caixa de contato central (igual ao flyer original) -->
        <div class="contact-box">
            <a href="https://wa.me/5521992082838?text=Olá!%20Gostaria%20de%20agendar%20uma%20visita%20técnica." target="_blank" class="contact-btn">
                <span class="emoji">🟢</span>
                <span style="color: #000; font-size: 1.05rem;">(21) 99208-2838</span>
            </a>
            <a href="https://www.instagram.com/jetclean_refrigeracao" target="_blank" class="contact-btn">
                <span class="emoji">📸</span>
                <span style="color: #000; font-size: 0.95rem;">jetclean_refrigeracao</span>
            </a>
        </div>

        <!-- Seção reorganizada dos eletrodomésticos -->
        <div class="appliances-section">
            <div class="row-top">
                <div class="left-info">
                    <h2>Agende já sua visita técnica</h2>
                </div>
                <div class="right-fridge">
                    <img src="geladeira.png" alt="Geladeira e Freezer">
                </div>
            </div>

            <div class="grid-middle">
                <div class="item-card">
                    <img src="split.png" alt="Ar Split">
                </div>
                <div class="item-card">
                    <img src="maquina.png" alt="Máquina de Lavar">
                </div>
                <div class="item-card">
                    <img src="janela.png" alt="Ar de Janela">
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 10px;">
                <img src="micro.png" alt="Micro-ondas" style="max-width: 110px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));">
            </div>
        </div>

        <!-- Rodapé com os textos pedidos -->
        <div class="info-footer">
            <p>💳 Aceitamos cartões e Pix</p>
            <p>📅 Agende já sua visita técnica!</p>
        </div>

        <!-- Barra inferior flutuante de ações rápidas -->
        <div class="buttons-bar">
            <a href="https://wa.me/5521992082838?text=Olá!%20Gostaria%20de%20agendar%20uma%20visita%20técnica." target="_blank" class="btn-action">
                <span class="icon">💚</span>
                <span>WhatsApp</span>
            </a>
            <a href="tel:5521992082838" class="btn-action">
                <span class="icon">📞</span>
                <span>Ligar</span>
            </a>
            <a href="https://www.instagram.com/jetclean_refrigeracao" target="_blank" class="btn-action">
                <span class="icon">📸</span>
                <span>Instagram</span>
            </a>
        </div>
    </div>

    <script>
        // Efeito de flocos de neve (❄, ❅, ❆)
        function createSnow() {
            const container = document.getElementById('snow-container');
            const numberOfFlakes = 25;
            const symbols = ['❄', '❅', '❆'];

            for (let i = 0; i < numberOfFlakes; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                
                flake.style.left = Math.random() * 100 + '%';
                flake.style.top = -20 + 'px';
                
                const size = (Math.random() * 8 + 10) + 'px';
                flake.style.fontSize = size;
                
                const duration = (Math.random() * 4 + 3) + 's';
                flake.style.animationDuration = duration;
                
                const delay = (Math.random() * 5) + 's';
                flake.style.animationDelay = delay;
                
                container.appendChild(flake);
            }
        }
        createSnow();
    </script>
</body>
</html>
