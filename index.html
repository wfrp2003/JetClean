<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Clean Refrigeração</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b192c;
            overflow: hidden;
            position: relative;
        }

        /* Imagem preenchendo a tela toda */
        .flyer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('flyer.jpg.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Flocos de neve finos caindo por cima da imagem */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 10;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0);
            }
            100% {
                transform: translateY(105vh) translateX(15px);
            }
        }

        /* Hotspots Clicáveis */
        .hotspot-whatsapp {
            position: absolute;
            bottom: 3.5%;
            left: 5%;
            width: 43%;
            height: 12%;
            z-index: 5;
            cursor: pointer;
        }

        .hotspot-phone {
            position: absolute;
            bottom: 3.5%;
            left: 52%;
            width: 43%;
            height: 12%;
            z-index: 5;
            cursor: pointer;
        }

        .hotspot-instagram {
            position: absolute;
            bottom: 1%;
            left: 5%;
            width: 43%;
            height: 3%;
            z-index: 5;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="flyer-container">
        <a href="https://wa.me/5521992082838?text=Olá!%20Gostaria%20de%20agendar%20uma%20visita%20técnica." target="_blank" class="hotspot-whatsapp" title="Agendar via WhatsApp"></a>
        <a href="tel:5521992082838" class="hotspot-phone" title="Ligar diretamente"></a>
        <a href="https://www.instagram.com/jetclean_refrigeracao" target="_blank" class="hotspot-instagram" title="Visitar Instagram"></a>
    </div>

    <script>
        // Gerador de flocos de neve finos
        function createSnowflake() {
            const snow = document.createElement('div');
            snow.classList.add('snowflake');
            snow.style.left = Math.random() * window.innerWidth + 'px';
            
            // Tamanho reduzido para parecerem flocos reais e não bolas grandes
            const size = Math.random() * 3 + 1.5 + 'px'; 
            snow.style.width = size;
            snow.style.height = size;
            
            snow.style.animationDuration = Math.random() * 4 + 2 + 's';
            snow.style.opacity = Math.random() * 0.7 + 0.3;
            document.body.appendChild(snow);

            setTimeout(() => {
                snow.remove();
            }, 6000);
        }

        // Criar flocos continuamente
        setInterval(createSnowflake, 100);
    </script>

</body>
</html>
